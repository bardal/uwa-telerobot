; MOM user database: one [username] section per user.
;   PIN       password; -1 means no password needed
;   UserLevel Guest | Registered | Teaching | Team  (higher levels can take
;             control of the robot from lower ones)
; Change the PINs below before exposing MOM beyond localhost.

[guest]
name=Guest
PIN=-1
UserLevel=Guest

[team]
name=Telerobot Team
PIN=1234
UserLevel=Team

; service accounts used by RobotProxy and the camera server
[robot]
name=Robot proxy
PIN=robot-local
UserLevel=Registered

[camera]
name=Camera server
PIN=camera-local
UserLevel=Registered
